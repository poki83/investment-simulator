name: Google Play Build (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Versionsname (z.B. 1.0.0)'
        required: false
        default: '1.0.0'
      versionCode:
        description: 'VersionCode (ganze Zahl, bei jedem Upload erhöhen)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Abhängigkeiten installieren
        run: npm ci || npm install

      - name: Web-Assets bauen
        run: npm run build:www

      - name: Android-Projekt generieren
        run: npx cap add android

      - name: Signing-Keystore einspielen
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android
          echo "$KS" | base64 -d > keystore.p12
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      def p12 = rootProject.file('keystore.p12')
                      def props = rootProject.file('keystore.properties')
                      if (p12.exists() && props.exists()) {
                          def ps = new Properties()
                          props.withInputStream { it -> ps.load(it) }
                          storeFile p12
                          storeType 'PKCS12'
                          storePassword ps['storePassword']
                          keyAlias ps['keyAlias']
                          keyPassword ps['keyPassword']
                      }
                  }
              }
              buildTypes.release.signingConfig = signingConfigs.release
          }
          GRADLE

      - name: Version setzen
        run: |
          cd android
          node -e "
            const fs=require('fs');
            let f='variables.gradle';
            let v=fs.readFileSync(f,'utf8');
            v=v.replace(/versionCode\s*=\s*[^\n]+/, \"versionCode = \${{ inputs.versionCode }}\");
            v=v.replace(/versionName\s*=\s*[^\n]+/, \"versionName = '\${{ inputs.versionName }}'\");
            fs.writeFileSync(f,v);
          "

      - name: Debug-APK bauen (zum Testen/Sideload)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Signiertes AAB bauen (Google Play)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Hinweis, falls Keystore fehlt
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 ist nicht gesetzt – deshalb wurde nur die Debug-APK gebaut (Anleitung dazu im Chat)."

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: investsim-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn